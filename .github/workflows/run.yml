name: Morning News Bot

on:
  workflow_dispatch:
  schedule:
    # 매일 8시부터 17시까지 매 시간 정각에 실행 (UTC 기준이므로 한국 시간 8시~17시는 UTC 23시~08시 등 조정 필요)
    # 편하게 한국 시간 기준(KST)으로 돌리려면 아래 Cron을 사용하세요 (UTC 23시 ~ 08시 = KST 08시 ~ 17시)
    - cron: '0 23,0-8 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot
        env:
          KAKAO_TOKEN: ${{ secrets.KAKAO_TOKEN }}
        run: |
          python news_bot.py
